<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Valuta váltás</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <div class="d-flex w-50 flex-column border rounded shadow p-3 mb-5 bg-body-tertiar align-items-center">

        <div class="p-2"><h1>💱Valuta váltó</h1></div>

        <div class="align-items-left">

            <div class="p-2"><p>Összeg(HUF)</p></div>
            <div class="p-2"><input type="number" id="money" class="rounded border"></div>
            <div class="p-2"><p>Cél valuta</p></div>
            <div class="p-2">
                <Select id="selectors" class="rounded border w-100">
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="USD">USD </option>
                </Select>
            </div>
        </div>
        <div class="p-2"><button onclick="go()" class="text-light bg-primary rounded border">Átváltás</button></div>
            <div class="p-2">
                <div id="ret">
                </div>
            </div>


    </div>

</body>
</html>
